name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The build reads the kit from ../Kit: the app and the kit are checked out side by side.
    defaults:
      run:
        working-directory: griot
    steps:
      - uses: actions/checkout@v4
        with:
          path: griot

      - uses: actions/checkout@v4
        with:
          repository: Krawist/kit
          path: Kit

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: 'griot/**/build/reports/'
          if-no-files-found: ignore
